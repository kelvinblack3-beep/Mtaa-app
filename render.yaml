# Mtaa deployment configuration for Render
# This file is a declarative manifest only.
# Do NOT use it to create services from this repository automation.
# ChatGPT / the operator will handle actual Render deployment.

services:
  - type: web
    name: mtaa-api
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mtaa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DARAJA_MODE
        value: simulation
      - key: SOLANA_NETWORK
        value: devnet
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: mtaa-frontend
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: mtaa-db
    plan: starter
    databaseName: mtaa
    user: mtaa
    region: frankfurt
